name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          # CPU-only torch stack. NB: --index-url alone would REPLACE PyPI
          # (torch's deps like sympy/numpy live there), so keep PyPI as the
          # extra index.
          # torchaudio/torchvision must be pinned to this index too. ComfyUI's
          # requirements (below) list all three unpinned, so pip would otherwise
          # find `torch` satisfied but fetch torchaudio from PyPI - and the
          # Linux wheel there is the CUDA build. Its _torchaudio.abi3.so needs
          # libcudart.so.13, which the runner does not have, so
          # tests/test_audio_vae_guard.py failed on load.
          python -m pip install torch torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
          # The Director's own extras (opencv/imageio-ffmpeg/scenedetect).
          python -m pip install -r requirements.txt
          # Director modules import comfy / folder_paths / comfy_extras /
          # comfy_execution / server / latent_preview / node_helpers at runtime,
          # so a real ComfyUI checkout must be importable (see conftest.py).
          git clone --depth 1 https://github.com/Comfy-Org/ComfyUI.git /tmp/ComfyUI
          python -m pip install -r /tmp/ComfyUI/requirements.txt

      - name: Run Python test suite
        env:
          PYTHONPATH: /tmp/ComfyUI
        run: python -m pytest

  frontend-tests:
    name: Frontend tests (node --check + unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install frontend dev dependencies (jsdom)
        run: npm install

      - name: Syntax-check all frontend modules
        run: |
          for f in $(find web/js -name '*.js' -o -name '*.mjs'); do
            node --check "$f"
          done

      - name: Run standalone JS unit tests
        run: npm test
